<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D First-Person Shooter</title>
    <link rel="stylesheet" href="./style.css?v=108" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div
      id="crosshair"
      class="crosshair"
      aria-hidden="true"
    ></div>
    <div id="scopeOverlay" class="scope-overlay" aria-hidden="true"></div>
    <div class="hud">
      <div id="weaponSlots" class="weapon-slots" aria-label="Equipped weapons"></div>
      <div>Score: <span id="score">0</span></div>
      <div class="hint">Click to lock the mouse · WASD move · Shift sprint · Space jump · F pick up · E drop · LMB shoot/punch · RMB ADS · Scroll to zoom while ADS · 1/2/Q switch · C camera · O god view · Esc release mouse</div>
    </div>
    <div id="weaponPrompt" class="weapon-prompt hidden" aria-live="polite"></div>
    <script src="./gltf.js?v=108"></script>
    <script src="./game.js?v=108"></script>
  </body>
</html>
