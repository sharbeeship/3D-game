<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第一人称枪战小游戏</title>
    <link rel="stylesheet" href="./style.css?v=36" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div
      id="crosshair"
      class="crosshair"
      aria-hidden="true"
    ></div>
    <div id="scopeOverlay" class="scope-overlay" aria-hidden="true"></div>
    <div class="hud">
      <div id="weaponSlots" class="weapon-slots" aria-label="手持枪械"></div>
      <div>分数：<span id="score">0</span></div>
      <div class="hint">点击画面锁定鼠标 · WASD 移动 · Shift 跑步 · 空格跳跃 · F 拾取 · E 弃枪 · 左键射击/挥拳 · 右键开镜 · 开镜滚轮调倍 · 1/2/Q 切枪 · Esc 释放鼠标</div>
    </div>
    <div id="weaponPrompt" class="weapon-prompt hidden" aria-live="polite"></div>
    <div id="start" class="start">
      <h1>第一人称枪战小游戏</h1>
      <p>点击开始锁定鼠标。拾取枪械后可射击、开镜、切枪；空手时左键挥拳。贴墙时枪和手不会穿模。</p>
      <button>开始游戏</button>
    </div>
    <script src="./game.js?v=36"></script>
  </body>
</html>
